<!DOCTYPE html>
<html>
<head>
  <title>MPL Robotics Lab</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>MPL Robotic Legs Lab</h1>

  <div class="panel">
    <h2>Status</h2>
    <p id="status">System Offline</p>
  </div>

  <div class="panel">
    <h2>Controls</h2>

    <button onclick="moveForward()">Forward</button>
    <button onclick="moveBackward()">Backward</button>
    <button onclick="stopRobot()">Stop</button>
  </div>

  <div class="panel">
    <h2>Telemetry</h2>
    <p>Joint Angle: <span id="angle">0</span></p>
    <p>Power Load: <span id="power">0</span></p>
  </div>

<script src="app.js"></script>

</body>
</html>
